<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopy Sensor Case 3D</title>
<style>
:root {
  --ground: #EFF1EC; --panel: #F7F8F5; --ink: #191C19; --ink-2: #4B524B;
  --ink-3: #767D74; --rule: #D3D7CE; --rule-2: #E2E5DE; --blue: #2E5C7A;
  --accent: #A3402B; --green: #3D6B4A; --bed: #C8C9C1; --sky: #E6E8E2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141715; --panel: #1B1F1C; --ink: #E7EAE4; --ink-2: #A9B0A7;
    --ink-3: #7C837A; --rule: #303631; --rule-2: #252A26; --blue: #7FB0CE;
    --accent: #E08A70; --green: #7FB48E; --bed: #2A2E29; --sky: #101311;
  }
  :root:not([data-theme="light"]) #stage { background: #15181A; }
}
:root[data-theme="dark"] {
  --ground: #141715; --panel: #1B1F1C; --ink: #E7EAE4; --ink-2: #A9B0A7;
  --ink-3: #7C837A; --rule: #303631; --rule-2: #252A26; --blue: #7FB0CE;
  --accent: #E08A70; --green: #7FB48E; --bed: #2A2E29; --sky: #101311;
}
:root[data-theme="dark"] #stage { background: #15181A; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
  display: grid; grid-template-columns: 1fr 20rem; overflow: hidden;
}
#stage { position: relative; min-width: 0; background: #B9BEBA; }
#stage canvas { display: block; }
/* The bed is nearly black and the ground is mid grey, so the hint cannot take
   its colour from either. It gets its own chip instead. */
#hint {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 0.7rem;
  font-size: 0.68rem; color: #F2F4F1; pointer-events: none;
  background: rgba(20, 24, 22, 0.5); padding: 0.22rem 0.6rem; border-radius: 99px;
  font-family: "JetBrains Mono", ui-monospace, monospace; white-space: nowrap;
  max-width: calc(100% - 2rem); overflow: hidden; text-overflow: ellipsis;
}
#rail {
  background: var(--panel); border-left: 1px solid var(--rule);
  padding: 1.1rem 1.1rem 1.6rem; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1.25rem;
}
h1 { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.eyebrow {
  font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.62rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 0.2rem;
}
.meta { font-size: 0.74rem; color: var(--ink-2); line-height: 1.45; margin: 0.35rem 0 0; }
h2 {
  font-size: 0.62rem; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600; margin: 0 0 0.55rem;
  padding-bottom: 0.35rem; border-bottom: 1px solid var(--rule-2);
}
section { display: block; }
.seg { display: flex; flex-direction: column; gap: 0.3rem; }
.seg button {
  font: inherit; font-size: 0.78rem; text-align: left; padding: 0.45rem 0.6rem;
  background: none; color: var(--ink-2); border: 1px solid var(--rule);
  border-radius: 3px; cursor: pointer;
}
.seg button:hover { border-color: var(--ink-3); color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--blue); border-color: var(--blue); color: var(--panel); font-weight: 600;
}
.seg button .sub { display: block; font-size: 0.68rem; opacity: 0.78; font-weight: 400; }
.views { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.views button {
  font: inherit; font-size: 0.72rem; padding: 0.3rem 0.55rem; background: none;
  color: var(--ink-2); border: 1px solid var(--rule); border-radius: 3px; cursor: pointer;
}
.views button:hover { border-color: var(--ink-3); color: var(--ink); }
.check { display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem;
         color: var(--ink-2); padding: 0.24rem 0; cursor: pointer; }
.check input { accent-color: var(--blue); }
.swatch { width: 0.7rem; height: 0.7rem; border-radius: 2px; border: 1px solid var(--rule);
          flex: none; }
.row { display: flex; align-items: center; gap: 0.5rem; }
input[type=range] { flex: 1; accent-color: var(--blue); min-width: 0; }
select { font: inherit; font-size: 0.74rem; background: var(--ground); color: var(--ink);
         border: 1px solid var(--rule); border-radius: 3px; padding: 0.2rem 0.3rem; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.7rem;
        color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 3.4rem;
        text-align: right; }
dl.readout { display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 0.6rem; margin: 0;
             font-size: 0.74rem; }
dl.readout dt { color: var(--ink-2); }
dl.readout dd { margin: 0; font-family: "JetBrains Mono", ui-monospace, monospace;
                font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
dl.readout dd.tight { color: var(--accent); }
footer { font-size: 0.68rem; color: var(--ink-3); line-height: 1.5;
         border-top: 1px solid var(--rule-2); padding-top: 0.7rem; }
footer code { font-family: "JetBrains Mono", ui-monospace, monospace; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--blue); outline-offset: 2px; }
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; overflow: auto; }
  #rail { border-left: none; border-top: 1px solid var(--rule); }
}
</style>

<div id="stage"><div id="hint">drag to orbit · wheel to zoom · shift-drag or right-drag to pan</div></div>

<aside id="rail">
  <div>
    <p class="eyebrow">GROWLAB · V1</p>
    <h1>Canopy sensor case</h1>
    <p class="meta" id="meta"></p>
  </div>

  <section>
    <h2>View</h2>
    <div class="seg" id="modes" role="group" aria-label="View mode"></div>
  </section>

  <section id="explode-wrap">
    <h2>Explode</h2>
    <div class="row">
      <input type="range" id="explode" min="0" max="100" value="0" aria-label="Explode">
      <span class="mono" id="explode-val">0&nbsp;mm</span>
    </div>
  </section>

  <section>
    <h2>Look from</h2>
    <div class="views">
      <button type="button" data-view="iso">Iso</button>
      <button type="button" data-view="front">Front</button>
      <button type="button" data-view="side">Side</button>
      <button type="button" data-view="plan">Plan</button>
      <button type="button" data-view="rear">Rear</button>
    </div>
  </section>

  <section>
    <h2>Section</h2>
    <div class="row" style="margin-bottom:0.45rem">
      <select id="cut-axis" aria-label="Section axis">
        <option value="none">No cut</option>
        <option value="y">Through the port, across</option>
        <option value="x">Through the port, along</option>
        <option value="z">Horizontal</option>
      </select>
    </div>
    <div class="row">
      <input type="range" id="cut" min="0" max="1000" value="500" aria-label="Section position" disabled>
      <span class="mono" id="cut-val">—</span>
    </div>
  </section>

  <section>
    <h2>Parts</h2>
    <div id="parts"></div>
  </section>

  <section>
    <h2>The numbers that decide it</h2>
    <dl class="readout" id="readout"></dl>
  </section>

  <footer id="foot"></footer>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = /*__CASE_DATA__*/null;

function b64ToBuffer(s) {
  const bin = atob(s);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}

const dark = () =>
  document.documentElement.dataset.theme === 'dark' ||
  (matchMedia('(prefers-color-scheme: dark)').matches &&
   document.documentElement.dataset.theme !== 'light');

// Canvas colours, kept here rather than read back out of the CSS, because they
// are not the page's colours. A matte white object photographs against
// something darker than itself or it has no silhouette at all: the first cut of
// this page put a #F2F4F1 part on a #E6E8E2 ground, which is 1.12:1, and the
// case dissolved into the background. The bed is darker still because a
// textured PEI sheet is nearly black, which is both true and exactly what a
// white part wants behind it.
function palette() {
  return dark()
    ? { bg: 0x15181A, floor: 0x22262A, grid: 0x343A3E, block: 0x4A4A46, bed: 0x26292B,
        edge: 0x0A0C0D }
    : { bg: 0xB9BEBA, floor: 0xA9AEAA, grid: 0x999E9A, block: 0x9A9590, bed: 0x3A3D3E,
        edge: 0x1A1F22 };
}

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 4000);

// Z is up, on the camera — not by turning the model. Rotating the scene root
// instead leaves every light in a frame the model no longer shares: the first
// cut of this page did that, and its key light came out at model Z -140, under
// the floor, so the top face — the one face this object is ever looked at
// from — was lit by nothing but the fill.
camera.up.set(0, 0, 1);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a857c, 0.62));
const key = new THREE.DirectionalLight(0xffffff, 0.78);
key.position.set(-70, -120, 150);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.28);
scene.add(fill);
fill.position.set(95, 70, 45);
const rim = new THREE.DirectionalLight(0xffffff, 0.22);
rim.position.set(40, 130, -60);
scene.add(rim);

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
let clipping = false;
const meshes = {};
const edges = {};
const visible = {};

function makeMaterial(spec) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(spec.colour),
    roughness: spec.roughness ?? 0.8,
    metalness: 0.02,
    transparent: spec.opacity < 1,
    opacity: spec.opacity,
    side: THREE.DoubleSide,
    clippingPlanes: [],
  });
}

// A white part on a white part is separated by shading alone, and shading on a
// 2 mm wall is a few percent of value. The edges are what make a chamfer, a
// boss and a vent slot read — and they cost nothing on 7,700 triangles. The
// threshold is above the 11.5 deg of the tessellation, so a cylinder stays
// smooth and only real edges are drawn.
const edgeMaterial = new THREE.LineBasicMaterial({
  color: palette().edge, transparent: true, opacity: 0.55, clippingPlanes: [],
});

for (const [name, md] of Object.entries(DATA.meshes)) {
  const spec = DATA.parts[name];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(
    new Float32Array(b64ToBuffer(md.positions)), 3));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(b64ToBuffer(md.indices)), 1));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, makeMaterial(spec));
  mesh.name = name;
  const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 26), edgeMaterial);
  mesh.add(line);          // a child, so it follows the part when it explodes
  edges[name] = line;
  meshes[name] = mesh;
  visible[name] = spec.on !== false;
  scene.add(mesh);
}

/* ---------------------------------------------------------------- ground */
const p0 = palette();

// The block, as a slab: the case's ground in every mode but the print one.
const BLOCK_H = 60;
const block = new THREE.Mesh(
  new THREE.BoxGeometry(DATA.block.len, DATA.block.wid, BLOCK_H),
  new THREE.MeshStandardMaterial({ color: p0.block, roughness: 1 }));
block.position.set(DATA.block.x, DATA.block.y, -BLOCK_H / 2);
scene.add(block);

// The bed, for print orientation. A grid at 10 mm, which is the scale a person
// checking a 58 mm part actually thinks in.
const bed = new THREE.Mesh(
  new THREE.PlaneGeometry(260, 260),
  new THREE.MeshStandardMaterial({ color: p0.bed, roughness: 0.9 }));
bed.position.z = -0.08;
scene.add(bed);
const bedGrid = new THREE.GridHelper(260, 26, p0.grid, p0.grid);
bedGrid.rotation.x = Math.PI / 2;
bedGrid.position.z = -0.04;
bedGrid.material.opacity = 0.3;
bedGrid.material.transparent = true;
scene.add(bedGrid);

// A floor well below everything, so the frame has a horizon rather than
// ending in flat background wherever the block stops.
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(2400, 2400),
  new THREE.MeshStandardMaterial({ color: p0.floor, roughness: 1 }));
floor.position.z = -BLOCK_H;
scene.add(floor);

/* ---------------------------------------------------------------- modes */
const MODES = DATA.modes;
let mode = 'assembled';
let explode = 0;

function layout() {
  const m = MODES[mode];
  for (const [name, mesh] of Object.entries(meshes)) {
    const spec = DATA.parts[name];
    const place = m.place[name];
    if (!place) { mesh.visible = false; continue; }
    mesh.visible = visible[name] && (m.shows ? m.shows.includes(name) : true);
    mesh.rotation.set(place.flip ? Math.PI : 0, 0, 0);
    // A part's explode vector is a direction and a share of the slider's span
    // in millimetres, not a position, so it is scaled by both.
    const e = m.explodes ? (spec.explode || [0, 0, 0]) : [0, 0, 0];
    const d = explode * DATA.explodeSpan;
    mesh.position.set(place.at[0] + e[0] * d,
                      place.at[1] + e[1] * d,
                      place.at[2] + e[2] * d);
  }
  block.visible = m.block && visible.block;
  floor.visible = !!m.block;
  bed.visible = bedGrid.visible = !!m.bed;
  frame(m.frameFull ? lerpFrame(m.frame, m.frameFull, explode) : m.frame);
}

function lerpFrame(a, b, t) {
  const f = {};
  for (const k of ['cx', 'cy', 'cz', 'r']) f[k] = a[k] + (b[k] - a[k]) * t;
  return f;
}

/* ---------------------------------------------------------------- camera */
// Spherical about the target, in the model's own frame: theta about Z measured
// from -Y, phi from +Z. The same convention as the station viewer, which is
// worth matching exactly — it is the one place a person switching between the
// two pages would otherwise have to relearn the mouse.
const target = new THREE.Vector3();
let sph = { r: 160, theta: -0.62, phi: 1.06 };

function frame(box) {
  target.set(box.cx, box.cy, box.cz);
  sph.r = box.r;
  applyCamera();
}
function applyCamera() {
  camera.position.set(
    target.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    target.y - sph.r * Math.sin(sph.phi) * Math.cos(sph.theta),
    target.z + sph.r * Math.cos(sph.phi));
  camera.lookAt(target);
}

const VIEWS = {
  iso: { theta: -0.62, phi: 1.06 },
  front: { theta: 0, phi: Math.PI / 2 },
  side: { theta: Math.PI / 2, phi: Math.PI / 2 },
  plan: { theta: 0, phi: 0.0001 },
  rear: { theta: Math.PI, phi: 1.25 },
};
document.querySelectorAll('[data-view]').forEach(b =>
  b.addEventListener('click', () => {
    const v = VIEWS[b.dataset.view];
    sph.theta = v.theta; sph.phi = v.phi;
    applyCamera();
  }));

let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 1 || e.button === 2 };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const scale = sph.r / stage.clientHeight * 1.4;
    const right = new THREE.Vector3(), up = new THREE.Vector3();
    camera.matrix.extractBasis(right, up, new THREE.Vector3());
    target.addScaledVector(right, -dx * scale).addScaledVector(up, dy * scale);
  } else {
    sph.theta -= dx * 0.007;
    sph.phi = Math.min(Math.PI - 0.02, Math.max(0.02, sph.phi - dy * 0.007));
  }
  applyCamera();
});
addEventListener('pointerup', () => { drag = null; });
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  sph.r = Math.min(900, Math.max(14, sph.r * (1 + Math.sign(e.deltaY) * 0.11)));
  applyCamera();
}, { passive: false });

/* ---------------------------------------------------------------- rail */
const modesEl = document.getElementById('modes');
for (const [k, m] of Object.entries(MODES)) {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `${m.label}<span class="sub">${m.note}</span>`;
  b.setAttribute('aria-pressed', String(k === mode));
  b.addEventListener('click', () => {
    mode = k;
    for (const other of modesEl.children) other.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-pressed', 'true');
    document.getElementById('explode-wrap').style.display = m.explodes ? '' : 'none';
    if (m.view) { sph.theta = m.view.theta; sph.phi = m.view.phi; }
    layout();
  });
  modesEl.appendChild(b);
}

const partsEl = document.getElementById('parts');
function addCheck(id, label, colour, onChange) {
  const l = document.createElement('label');
  l.className = 'check';
  const i = document.createElement('input');
  i.type = 'checkbox'; i.checked = true; i.id = 'p-' + id;
  i.addEventListener('change', () => onChange(i.checked));
  const sw = document.createElement('span');
  sw.className = 'swatch'; sw.style.background = colour;
  const t = document.createElement('span');
  t.textContent = label;
  l.append(i, sw, t);
  partsEl.appendChild(l);
}
for (const [name, spec] of Object.entries(DATA.parts)) {
  addCheck(name, spec.label, spec.colour, (on) => { visible[name] = on; layout(); });
}
visible.block = true;
addCheck('block', 'The block (reference)', '#9A9590', (on) => { visible.block = on; layout(); });

let showEdges = true;
addCheck('edges', 'Edges', 'transparent', (on) => {
  showEdges = on;
  for (const l of Object.values(edges)) l.visible = on;
});

const explodeEl = document.getElementById('explode');
const explodeVal = document.getElementById('explode-val');
explodeEl.addEventListener('input', () => {
  explode = explodeEl.value / 100;
  explodeVal.textContent = `${(explode * DATA.explodeSpan).toFixed(0)} mm`;
  layout();
});

const cutAxis = document.getElementById('cut-axis');
const cutEl = document.getElementById('cut');
const cutVal = document.getElementById('cut-val');
// A section is only a section if it takes away what stands between you and the
// inside. X and Y keep the far half, so the cut face opens toward the default
// view; Z keeps the lower half, because a horizontal cut is looked down into.
// three.js keeps the half where normal.p + constant >= 0.
const CUTS = {
  x: (at) => [new THREE.Vector3(1, 0, 0), -at],
  y: (at) => [new THREE.Vector3(0, 1, 0), -at],
  z: (at) => [new THREE.Vector3(0, 0, -1), at],
};

function applyCut() {
  const axis = cutAxis.value;
  clipping = axis !== 'none';
  cutEl.disabled = !clipping;
  const planes = clipping ? [clipPlane] : [];
  for (const m of Object.values(meshes)) {
    m.material.clippingPlanes = planes;
    m.material.needsUpdate = true;
  }
  edgeMaterial.clippingPlanes = planes;
  edgeMaterial.needsUpdate = true;
  if (!clipping) { cutVal.textContent = '—'; return; }
  const [lo, hi] = DATA.cut[axis];
  const at = lo + (cutEl.value / 1000) * (hi - lo);
  // The model is not rotated, so the section axis is the model's own.
  clipPlane.set(...CUTS[axis](at));
  cutVal.textContent = `${at.toFixed(1)} mm`;
}
cutAxis.addEventListener('change', applyCut);
cutEl.addEventListener('input', applyCut);

const readout = document.getElementById('readout');
for (const r of DATA.readout) {
  const dt = document.createElement('dt'); dt.textContent = r.label;
  const dd = document.createElement('dd'); dd.textContent = r.value;
  if (r.tight) dd.className = 'tight';
  readout.append(dt, dd);
}
document.getElementById('meta').textContent = DATA.meta;
document.getElementById('foot').innerHTML = DATA.foot;

/* ---------------------------------------------------------------- run */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function paint() {
  const p = palette();
  renderer.setClearColor(p.bg);
  block.material.color.setHex(p.block);
  bed.material.color.setHex(p.bed);
  floor.material.color.setHex(p.floor);
  bedGrid.material.color.setHex(p.grid);
  edgeMaterial.color.setHex(p.edge);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);

document.getElementById('explode-wrap').style.display = MODES[mode].explodes ? '' : 'none';
resize(); paint(); layout(); applyCut();
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
