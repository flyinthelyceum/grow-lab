<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GROWLAB P1 3D</title>
<style>
:root {
  --ground: #EFF1EC; --panel: #F7F8F5; --ink: #191C19; --ink-2: #4B524B;
  --ink-3: #767D74; --rule: #D3D7CE; --rule-2: #E2E5DE; --blue: #2E5C7A;
  --accent: #A3402B; --green: #3D6B4A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141715; --panel: #1B1F1C; --ink: #E7EAE4; --ink-2: #A9B0A7;
    --ink-3: #7C837A; --rule: #303631; --rule-2: #252A26; --blue: #7FB0CE;
    --accent: #E08A70; --green: #7FB48E;
  }
  :root:not([data-theme="light"]) #stage { background: #15181A; }
}
:root[data-theme="dark"] {
  --ground: #141715; --panel: #1B1F1C; --ink: #E7EAE4; --ink-2: #A9B0A7;
  --ink-3: #7C837A; --rule: #303631; --rule-2: #252A26; --blue: #7FB0CE;
  --accent: #E08A70; --green: #7FB48E;
}
:root[data-theme="dark"] #stage { background: #15181A; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
  display: grid; grid-template-columns: 1fr 20rem; overflow: hidden;
}
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #B9BEBA; }
/* Sized by CSS, and only by CSS: see the sensor case viewer. */
#stage canvas { display: block; width: 100%; height: 100%; }
#hint {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 0.7rem;
  font-size: 0.68rem; color: #F2F4F1; pointer-events: none;
  background: rgba(20, 24, 22, 0.5); padding: 0.22rem 0.6rem; border-radius: 99px;
  font-family: "JetBrains Mono", ui-monospace, monospace; white-space: nowrap;
  max-width: calc(100% - 2rem); overflow: hidden; text-overflow: ellipsis;
}
/* The camera view's frame: the sensor's 16:9, letterboxed in the stage, so
   what is inside the box is what the Pi records. */
#camframe {
  position: absolute; pointer-events: none; display: none;
  box-shadow: 0 0 0 100vmax rgba(10, 12, 12, 0.55);
  outline: 1px solid rgba(242, 244, 241, 0.7);
}
#rail {
  background: var(--panel); border-left: 1px solid var(--rule);
  padding: 1.1rem 1.1rem 1.6rem; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1.25rem;
}
h1 { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.eyebrow {
  font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.62rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 0.2rem;
}
.meta { font-size: 0.74rem; color: var(--ink-2); line-height: 1.45; margin: 0.35rem 0 0; }
h2 {
  font-size: 0.62rem; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600; margin: 0 0 0.55rem;
  padding-bottom: 0.35rem; border-bottom: 1px solid var(--rule-2);
}
section { display: block; }
.views { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.views button {
  font: inherit; font-size: 0.72rem; padding: 0.3rem 0.55rem; background: none;
  color: var(--ink-2); border: 1px solid var(--rule); border-radius: 3px; cursor: pointer;
}
.views button:hover { border-color: var(--ink-3); color: var(--ink); }
.views button[aria-pressed="true"] {
  background: var(--blue); border-color: var(--blue); color: var(--panel); font-weight: 600;
}
.check { display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem;
         color: var(--ink-2); padding: 0.24rem 0; cursor: pointer; }
.check input { accent-color: var(--blue); }
.swatch { width: 0.7rem; height: 0.7rem; border-radius: 2px; border: 1px solid var(--rule);
          flex: none; }
.row { display: flex; align-items: center; gap: 0.5rem; }
input[type=range] { flex: 1; accent-color: var(--blue); min-width: 0; }
select { font: inherit; font-size: 0.74rem; background: var(--ground); color: var(--ink);
         border: 1px solid var(--rule); border-radius: 3px; padding: 0.2rem 0.3rem; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.7rem;
        color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 3.4rem;
        text-align: right; }
dl.readout { display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 0.6rem; margin: 0;
             font-size: 0.74rem; }
dl.readout dt { color: var(--ink-2); }
dl.readout dd { margin: 0; font-family: "JetBrains Mono", ui-monospace, monospace;
                font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
dl.readout dd.tight { color: var(--accent); }
#live { margin-top: 0.6rem; }
footer { font-size: 0.68rem; color: var(--ink-3); line-height: 1.5;
         border-top: 1px solid var(--rule-2); padding-top: 0.7rem; }
footer code { font-family: "JetBrains Mono", ui-monospace, monospace; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--blue); outline-offset: 2px; }
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; overflow: auto; }
  #rail { border-left: none; border-top: 1px solid var(--rule); }
}
</style>

<div id="stage"><div id="camframe"></div><div id="hint">drag to orbit · wheel to zoom · shift-drag or right-drag to pan</div></div>

<aside id="rail">
  <div>
    <p class="eyebrow">GROWLAB · P1</p>
    <h1>The first-install prototype</h1>
    <p class="meta" id="meta"></p>
  </div>

  <section>
    <h2>Look from</h2>
    <div class="views" id="views">
      <button type="button" data-view="portfolio">Portfolio</button>
      <button type="button" data-view="iso">Iso</button>
      <button type="button" data-view="front">Front</button>
      <button type="button" data-view="side">Side</button>
      <button type="button" data-view="plan">Plan</button>
      <button type="button" data-view="rear">Rear</button>
      <button type="button" data-view="cam">Through the Pi camera</button>
    </div>
  </section>

  <section>
    <h2>Light over the media</h2>
    <div class="row">
      <input type="range" id="gap" min="0" max="1" step="1" value="0" aria-label="Light over the media">
      <span class="mono" id="gap-val">—</span>
    </div>
    <dl class="readout" id="live"></dl>
  </section>

  <section>
    <h2>Crook paint (DTM)</h2>
    <div class="views" id="paints"></div>
  </section>

  <section>
    <h2>Section</h2>
    <div class="row" style="margin-bottom:0.45rem">
      <select id="cut-axis" aria-label="Section axis">
        <option value="none">No cut</option>
        <option value="y">Through the crook's plane</option>
        <option value="x">Across, left to right</option>
        <option value="z">Horizontal</option>
      </select>
    </div>
    <div class="row">
      <input type="range" id="cut" min="0" max="1000" value="500" aria-label="Section position" disabled>
      <span class="mono" id="cut-val">—</span>
    </div>
  </section>

  <section>
    <h2>Parts</h2>
    <div id="parts"></div>
  </section>

  <section>
    <h2>The numbers that decide it</h2>
    <dl class="readout" id="readout"></dl>
  </section>

  <footer id="foot"></footer>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = /*__P1_DATA__*/null;

function b64ToBuffer(s) {
  const bin = atob(s);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}

const dark = () =>
  document.documentElement.dataset.theme === 'dark' ||
  (matchMedia('(prefers-color-scheme: dark)').matches &&
   document.documentElement.dataset.theme !== 'light');

// Canvas colours, not the page's: concrete, oak and white PETG all want a
// ground darker than themselves or they lose their silhouettes.
function palette() {
  return dark()
    ? { bg: 0x15181A, floor: 0x22262A, grid: 0x343A3E, edge: 0x0A0C0D, fov: 0x7FB0CE }
    : { bg: 0xB9BEBA, floor: 0xA9AEAA, grid: 0x999E9A, edge: 0x1A1F22, fov: 0x2E5C7A };
}

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const ORBIT_FOV = 34;
const camera = new THREE.PerspectiveCamera(ORBIT_FOV, 1, 0.05, 2000);
// Z is up, on the camera, not by turning the model: the lights stay in the
// model's frame (the sensor case viewer learnt this the hard way).
camera.up.set(0, 0, 1);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a857c, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 0.75);
key.position.set(-40, -70, 90);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.28);
fill.position.set(60, 40, 30);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.2);
rim.position.set(20, 80, -30);
scene.add(rim);

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const meshes = {};
const edges = {};
const visible = {};
const materials = [];

function makeMaterial(spec) {
  const m = new THREE.MeshStandardMaterial({
    color: new THREE.Color(spec.colour),
    roughness: spec.roughness ?? 0.8,
    metalness: spec.metalness ?? 0.02,
    side: THREE.DoubleSide,
    clippingPlanes: [],
  });
  materials.push(m);
  return m;
}

const edgeMaterial = new THREE.LineBasicMaterial({
  color: palette().edge, transparent: true, opacity: 0.4, clippingPlanes: [],
});
materials.push(edgeMaterial);

for (const [name, spec] of Object.entries(DATA.parts)) {
  const md = DATA.meshes[name];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(
    new Float32Array(b64ToBuffer(md.positions)), 3));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(b64ToBuffer(md.indices)), 1));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, makeMaterial(spec));
  mesh.name = name;
  // Above the tessellation's 17 deg, so a tube stays smooth and only real
  // edges -- the block's arrises, the beam's pockets -- are drawn.
  const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28), edgeMaterial);
  mesh.add(line);
  edges[name] = line;
  meshes[name] = mesh;
  visible[name] = true;
  scene.add(mesh);
}

/* ---------------------------------------------------------------- ground */
const p0 = palette();
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(1200, 1200),
  new THREE.MeshStandardMaterial({ color: p0.floor, roughness: 1 }));
floor.position.z = -0.02;
scene.add(floor);
// A foot grid: the scale the room is laid out in.
const grid = new THREE.GridHelper(240, 20, p0.grid, p0.grid);
grid.rotation.x = Math.PI / 2;
grid.position.z = -0.01;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

/* ---------------------------------------------------------------- telescope */
// The camera's field, drawn as a wedge in the crook's plane from the lens down
// to the media: where it lands against the planter's two ends is the question.
const fovMat = new THREE.MeshBasicMaterial({
  color: p0.fov, transparent: true, opacity: 0.16, side: THREE.DoubleSide,
  depthWrite: false, clippingPlanes: [] });
materials.push(fovMat);
const fovGeo = new THREE.BufferGeometry();
fovGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(9), 3));
const fovWedge = new THREE.Mesh(fovGeo, fovMat);
fovWedge.renderOrder = 10;
scene.add(fovWedge);
visible.fov = true;

const H = DATA.heights;
let step = 0;

function camEye() {
  const e = DATA.camera.eye;
  return new THREE.Vector3(e[0], e[1], e[2] + H[step].rise);
}
const camDir = new THREE.Vector3(...DATA.camera.dir).normalize();

function layoutWedge() {
  const eye = camEye();
  const half = THREE.MathUtils.degToRad(DATA.camera.hfov / 2);
  const pts = [eye];
  for (const a of [-half, half]) {
    // Turn the axis about Y within the crook's plane, then run it to the media.
    const d = camDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
    const t = (DATA.mediaTop - eye.z) / d.z;
    pts.push(eye.clone().addScaledVector(d, t));
  }
  const arr = fovGeo.attributes.position.array;
  pts.forEach((p, i) => { arr[3 * i] = p.x; arr[3 * i + 1] = p.y; arr[3 * i + 2] = p.z; });
  fovGeo.attributes.position.needsUpdate = true;
  fovGeo.computeBoundingSphere();
  fovWedge.visible = visible.fov && view !== 'cam';
}

function layout() {
  const rise = H[step].rise;
  for (const [name, mesh] of Object.entries(meshes)) {
    mesh.visible = visible[name];
    mesh.position.z = DATA.parts[name].rides ? rise : 0;
  }
  layoutWedge();
  if (view === 'cam') applyCamera();
}

/* ---------------------------------------------------------------- camera */
// Spherical about the target: theta about Z measured from -Y, phi from +Z --
// the station and sensor case viewers' convention, so the mouse is the same.
const F = DATA.frame;
const centre = new THREE.Vector3((F.x0 + F.x1) / 2, (F.y0 + F.y1) / 2, F.z1 * 0.45);
const target = centre.clone();
const SPAN = Math.hypot(F.x1 - F.x0, F.z1);
let sph = { r: SPAN * 1.9, theta: -0.55, phi: 1.2 };
let view = 'portfolio';

const VIEWS = {
  // Standing, a little to the right, the lens at about 54 in: the shot the
  // piece is being built for.
  portfolio: { theta: -0.42, phi: 1.36, r: 1.75 },
  iso: { theta: -0.62, phi: 1.06, r: 1.9 },
  front: { theta: 0, phi: Math.PI / 2, r: 1.85 },
  side: { theta: Math.PI / 2, phi: Math.PI / 2, r: 1.85 },
  plan: { theta: 0, phi: 0.0001, r: 1.9 },
  rear: { theta: Math.PI, phi: 1.25, r: 1.9 },
};

const camframe = document.getElementById('camframe');
const hint = document.getElementById('hint');
const HINT = hint.textContent;

function applyCamera() {
  if (view === 'cam') {
    const eye = camEye();
    camera.position.copy(eye);
    // The sensor's long side lies along the planter, so the image's up is +Y,
    // away from the viewer.
    camera.up.set(0, 1, 0);
    camera.lookAt(eye.clone().add(camDir));
    // The frame is letterboxed to 16:9 and the field is the sensor's
    // horizontal one across the frame's width, not the stage's.
    const w = stage.clientWidth, h = stage.clientHeight;
    const fw = Math.min(w, h * 16 / 9), fh = fw * 9 / 16;
    const tanH = Math.tan(THREE.MathUtils.degToRad(DATA.camera.hfov / 2)) * (w / fw);
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(tanH / (w / h)));
    camera.updateProjectionMatrix();
    Object.assign(camframe.style, { display: 'block', width: fw + 'px', height: fh + 'px',
      left: (w - fw) / 2 + 'px', top: (h - fh) / 2 + 'px' });
    hint.textContent = 'Camera Module 3, as tilted in the beam · drag to leave';
    return;
  }
  camframe.style.display = 'none';
  hint.textContent = HINT;
  camera.up.set(0, 0, 1);
  if (camera.fov !== ORBIT_FOV) { camera.fov = ORBIT_FOV; camera.updateProjectionMatrix(); }
  camera.position.set(
    target.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    target.y - sph.r * Math.sin(sph.phi) * Math.cos(sph.theta),
    target.z + sph.r * Math.cos(sph.phi));
  camera.lookAt(target);
}

const viewButtons = document.querySelectorAll('[data-view]');
function setView(k) {
  view = k;
  viewButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === k)));
  if (k !== 'cam') {
    const v = VIEWS[k];
    target.copy(centre);
    sph = { r: SPAN * v.r, theta: v.theta, phi: v.phi };
  }
  layoutWedge();
  applyCamera();
}
viewButtons.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

// Any mouse move out of the camera view goes back to orbiting from where the
// last stock view left off, rather than from inside the beam.
function leaveCam() {
  if (view !== 'cam') return;
  view = '';
  viewButtons.forEach(b => b.setAttribute('aria-pressed', 'false'));
  layoutWedge();
}

let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 1 || e.button === 2 };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dx && !dy) return;
  drag.x = e.clientX; drag.y = e.clientY;
  leaveCam();
  if (drag.pan) {
    const scale = sph.r / stage.clientHeight * 0.6;
    const right = new THREE.Vector3(), up = new THREE.Vector3();
    camera.matrix.extractBasis(right, up, new THREE.Vector3());
    target.addScaledVector(right, -dx * scale).addScaledVector(up, dy * scale);
  } else {
    sph.theta -= dx * 0.007;
    sph.phi = Math.min(Math.PI - 0.02, Math.max(0.02, sph.phi - dy * 0.007));
  }
  applyCamera();
});
addEventListener('pointerup', () => { drag = null; });
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  leaveCam();
  sph.r = Math.min(800, Math.max(6, sph.r * (1 + Math.sign(e.deltaY) * 0.11)));
  applyCamera();
}, { passive: false });

/* ---------------------------------------------------------------- rail */
const gapEl = document.getElementById('gap');
const gapVal = document.getElementById('gap-val');
const live = document.getElementById('live');
gapEl.max = H.length - 1;
step = Math.max(0, H.findIndex(h => Math.abs(h.gap - DATA.drawnGap) < 1e-6));
gapEl.value = step;

const fmt = (v, d = 2) => v.toFixed(d);
function showHeight() {
  const h = H[step];
  gapVal.textContent = `${fmt(h.gap, 1)} in`;
  // Each row is a thing the model holds the telescope to; the two that are
  // the telescope's limits turn the accent colour where they bind.
  const rows = [
    ['Beam, floor to underside', `${fmt(h.beam_bottom, 1)} in`, false],
    ['1/2 tube still in the drop', `${fmt(h.held)} in`, step === 0],
    ['Hub to the coupling', `${fmt(h.hub_clear)} in`, step === H.length - 1],
    ['Camera, far end of the planter', `${fmt(h.far, 1)}° off axis`,
     Math.abs(h.far) > DATA.camera.hfov / 2 - 3],
    ['Camera, near end', `${fmt(h.near, 1)}° off axis`,
     Math.abs(h.near) > DATA.camera.hfov / 2 - 3],
  ];
  live.replaceChildren();
  for (const [a, b, t] of rows) {
    const dt = document.createElement('dt'); dt.textContent = a;
    const dd = document.createElement('dd'); dd.textContent = b;
    if (t) dd.className = 'tight';
    live.append(dt, dd);
  }
}
gapEl.addEventListener('input', () => { step = +gapEl.value; showHeight(); layout(); });

const paintsEl = document.getElementById('paints');
for (const [label, colour] of Object.entries(DATA.paints)) {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<span class="swatch" style="display:inline-block;vertical-align:-1px;margin-right:0.35rem;background:${colour}"></span>${label}`;
  b.setAttribute('aria-pressed', String(colour === DATA.parts.crook.colour));
  b.addEventListener('click', () => {
    for (const o of paintsEl.children) o.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-pressed', 'true');
    meshes.crook.material.color.set(colour);
    document.querySelector('#p-crook + .swatch').style.background = colour;
  });
  paintsEl.appendChild(b);
}

const partsEl = document.getElementById('parts');
function addCheck(id, label, colour, onChange) {
  const l = document.createElement('label');
  l.className = 'check';
  const i = document.createElement('input');
  i.type = 'checkbox'; i.checked = true; i.id = 'p-' + id;
  i.addEventListener('change', () => onChange(i.checked));
  const sw = document.createElement('span');
  sw.className = 'swatch'; sw.style.background = colour;
  const t = document.createElement('span');
  t.textContent = label;
  l.append(i, sw, t);
  partsEl.appendChild(l);
}
for (const [name, spec] of Object.entries(DATA.parts)) {
  addCheck(name, spec.label, spec.colour, (on) => { visible[name] = on; layout(); });
}
addCheck('fov', "Camera's field", 'transparent', (on) => { visible.fov = on; layoutWedge(); });
addCheck('edges', 'Edges', 'transparent', (on) => {
  for (const l of Object.values(edges)) l.visible = on;
});

const cutAxis = document.getElementById('cut-axis');
const cutEl = document.getElementById('cut');
const cutVal = document.getElementById('cut-val');
// Keep the half away from the default views: X and Y keep the far side, so the
// cut face opens toward the viewer; Z keeps the lower half, to look down into.
// three.js keeps the half where normal.p + constant >= 0.
const CUTS = {
  x: (at) => [new THREE.Vector3(1, 0, 0), -at],
  y: (at) => [new THREE.Vector3(0, 1, 0), -at],
  z: (at) => [new THREE.Vector3(0, 0, -1), at],
};
function applyCut() {
  const axis = cutAxis.value;
  const on = axis !== 'none';
  cutEl.disabled = !on;
  for (const m of materials) { m.clippingPlanes = on ? [clipPlane] : []; m.needsUpdate = true; }
  if (!on) { cutVal.textContent = '—'; return; }
  const [lo, hi] = DATA.cut[axis];
  const at = lo + (cutEl.value / 1000) * (hi - lo);
  clipPlane.set(...CUTS[axis](at));
  cutVal.textContent = `${at.toFixed(2)} in`;
}
cutAxis.addEventListener('change', () => {
  // Through the crook's plane is the useful default: the tubes in section.
  if (cutAxis.value === 'y') {
    const [lo, hi] = DATA.cut.y;
    cutEl.value = Math.round((DATA.camera.eye[1] - lo) / (hi - lo) * 1000);
  }
  applyCut();
});
cutEl.addEventListener('input', applyCut);

const readout = document.getElementById('readout');
for (const r of DATA.readout) {
  const dt = document.createElement('dt'); dt.textContent = r.label;
  const dd = document.createElement('dd'); dd.textContent = r.value;
  if (r.tight) dd.className = 'tight';
  readout.append(dt, dd);
}
document.getElementById('meta').textContent = DATA.meta;
document.getElementById('foot').innerHTML = DATA.foot;

/* ---------------------------------------------------------------- run */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
  applyCamera();
}
addEventListener('resize', resize);
new ResizeObserver(resize).observe(stage);

function paint() {
  const p = palette();
  renderer.setClearColor(p.bg);
  floor.material.color.setHex(p.floor);
  grid.material.color.setHex(p.grid);
  edgeMaterial.color.setHex(p.edge);
  fovMat.color.setHex(p.fov);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
new MutationObserver(paint).observe(document.documentElement,
  { attributes: true, attributeFilter: ['data-theme'] });

showHeight(); paint(); layout(); applyCut(); setView('portfolio'); resize();
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
