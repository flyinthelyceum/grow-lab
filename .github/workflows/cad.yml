name: CAD

# Builds the station geometry and publishes the STEP files as a downloadable
# artifact, so every change to cad/ produces something you can open in Fusion
# without installing the OCP kernel locally.
#
# Separate from deploy.yml because build123d pulls ~150 MB of kernel that the
# Pi never needs, and because CAD changes should not gate a Pi deploy.

on:
  push:
    branches: [main]
    paths:
      - "cad/**"
      - "pi/dashboard/panel_geometry.py"   # the head's face reads this
      - "tests/unit/test_cad_*.py"
      - ".github/workflows/cad.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "cad/**"
      - "pi/dashboard/panel_geometry.py"
      - "tests/unit/test_cad_*.py"
      - ".github/workflows/cad.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build station geometry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (with the cad extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cad]"

      - name: CAD tests
        # The geometry tests assert where every part sits against the docs'
        # height table and that nothing fabricated interferes; the fabrication
        # tests read the written DXFs back.
        run: pytest -q tests/unit/test_cad_params.py tests/unit/test_cad_geometry.py tests/unit/test_cad_fabrication.py

      - name: Build and export
        run: python cad/build.py

      - name: Build the fabrication pack
        # DXFs to cut from and a cut list to buy from, in inches.
        run: python cad/fabrication.py

      - name: Build the browser viewer
        # One HTML file with every part embedded; opens straight from the
        # artifact, no server.
        run: python cad/viewer.py

      - name: Summary
        run: |
          {
            echo "### Station geometry"
            echo ""
            python - <<'PY'
          import json
          r = json.load(open("cad/out/report.json"))
          d = r["depth_budget"]
          print(f"- static lift: **{r['static_lift_in']:.1f} in**")
          print(f"- panel centre: **{r['panel_centre_in']:.1f} in**")
          print(f"- fixture moment arm at the mast: **{r['fixture_cantilever_in']:.2f} in**")
          print(f"- depth budget through the wet bay: {d['required']:.2f} in required of {d['available']:.2f} → **{d['slack']:+.2f} in**")
          print(f"- rear door opening: {r['rear_door_opening_in']['width']:.2f} × {r['rear_door_opening_in']['height']:.2f} in")
          print(f"- fabricated interferences: **{len(r['interferences'])}**")
          print(f"- dial cut: {'not cut — pending calipers' if r['dial_cut_diameter'] is None else r['dial_cut_diameter']}")
          PY
            echo ""
            echo "STEP, \`viewer.html\` and the \`fab/\` pack are in the **growlab-v1-station-cad** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: growlab-v1-station-cad
          path: cad/out/
          retention-days: 90
