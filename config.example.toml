# GROWLAB — V0 Configuration
# Copy this file to config.toml and adjust for your setup.

[system]
log_level = "INFO"
data_dir = "~/grow-lab-data"
db_path = "~/grow-lab-data/growlab.db"

[i2c]
bus = 1  # /dev/i2c-1

[serial]
port = "/dev/ttyACM0"  # ESP32-S3 native USB CDC; classic ESP32 uses /dev/ttyUSB0
baud = 115200
timeout = 2.0


[sensors.bme280]
address = 0x76
interval_seconds = 120
enabled = true

[sensors.ezo_ph]
address = 0x63
interval_seconds = 300
enabled = true

[sensors.ezo_ec]
address = 0x64
interval_seconds = 300
enabled = true

[sensors.ds18b20]
interval_seconds = 120
enabled = true

[sensors.soil_moisture]
address = 0x48             # ADS1115 ADC address (reads DFRobot SEN0308 analog output)
interval_seconds = 300
enabled = true

[sensors.as7341]
address = 0x39
interval_seconds = 600
enabled = false

[sensors]
soil_moisture_channel = 0  # ADS1115 channel (0-3) for SEN0308

[camera]
interval_seconds = 600
resolution = [4608, 2592]
output_dir = "~/grow-lab-data/images"
enabled = true

[lighting]
on_hour = 6
off_hour = 22
intensity = 200        # PWM 0-255
ramp_minutes = 15
# Inches above the media surface, 12.0 to 33.0. The collar is set by hand and
# nothing else knows where it ended up -- and the AS7341 reads output and
# distance as ONE number, so without this a spectral reading cannot be compared
# with last month's, and a raised fixture looks exactly like a dimming board.
# Unset means nobody has written it down, which is what it is worth.
# fixture_above_media_in = 12.0

[[irrigation.schedules]]
hour = 8
minute = 0
duration_seconds = 10

[[irrigation.schedules]]
hour = 14
minute = 0
duration_seconds = 10

[[irrigation.schedules]]
hour = 20
minute = 0
duration_seconds = 10

[irrigation]
pump_controller = "gpio"   # "gpio" = Pi GPIO relay (V0 default), "esp32" = ESP32 serial
max_runtime_seconds = 30
min_interval_minutes = 60
relay_gpio = 17

[fan]
# Noctua NF-A12x25 PWM canopy fan on Pi hardware PWM (GPIO18 / pin 12).
# 4-pin PWM control, NOT a relay — see docs/WIRING_&_BUSES.md "Fan PWM Wiring".
# Leave disabled until the fan is physically wired and the 12V rail is up.
#
# This fan is for CANOPY STRENGTH, not cooling: moving air thickens stems.
# Duty is a gust field over time and takes no sensor input. It blows in spells
# of a few minutes and falls to nothing in between, because intermittent
# loading is what a stem responds to — a fan that never stops is a constant the
# plant just grows around.
enabled = false
gpio_pin = 18          # hardware PWM0
frequency = 25000      # 25 kHz — the Intel/Noctua 4-pin PWM standard
min_duty = 20          # below ~20% the fan stalls; 0 is off, 1-19 clamps up to 20
max_duty = 100
day_start_hour = 6     # match the [lighting] photoperiod
day_end_hour = 22
night_factor = 0.35    # overnight gusts at this fraction of daytime strength;
                       # not zero, because still wet air overnight grows mould
calm_threshold = 0.40  # gust field below this = fan fully off. Raise for longer
                       # lulls and a quieter piece, lower for more constant air
poll_interval_seconds = 5   # gusts need finer steps than a thermostat did

[control]
# Cross-process control channel. `growlab start` owns the hardware;
# `growlab dashboard` is a separate systemd unit and cannot reach it, so a
# manual fan duty or a pinned needle set from the web is written to the
# control_state table and reconciled here.
enabled = true
# How long a click takes to reach the hardware, worst case.
poll_interval_seconds = 2.0
# How long a manual override survives before lapsing back to automatic. This
# is a safety bound, not a convenience: without it a fan left at 0% from the
# web stays there through a hot afternoon.
override_ttl_seconds = 3600.0

[reservoir]
# Target water chemistry. THE one place these numbers are stated.
#
# They used to live in three: the runbook's prose (EC 800-1,200 uS/cm),
# alerts.py's constants (warn 800-1,600, critical 400-2,000) and this file's
# dial centre. Nothing derived from anything, so they drifted -- the docs
# called 1,300 uS/cm out of range while the alert service called it fine.
# The alert bands and both meter centres are computed from these fields now.
ph_target = 6.0            # dial centre
ph_warning_low = 5.8
ph_warning_high = 6.2
ph_critical_low = 5.0
ph_critical_high = 7.5

ec_target_us = 1000.0      # dial centre; midpoint of the runbook's 800-1,200
ec_warning_low_us = 800.0
ec_warning_high_us = 1200.0
ec_critical_low_us = 400.0
ec_critical_high_us = 1600.0

# Conductivity of the water going IN, before any nutrient. Tap, or near zero
# for RO. Salts only ever ADD conductivity, so a target at or below this is
# unreachable however much you dose -- the loader refuses that config rather
# than letting the station chase a number it cannot hit.
#
# Left unset because it has not been measured on an instrument that can be
# trusted in this range. The 1,529 uS/cm this project recorded in March does
# NOT count: that probe was calibrated at 12,880 and 80,000 uS/cm, points 8x
# and 52x above the band being controlled here. Recalibrate at 1,413 uS/cm
# first -- V1_GO_LIVE_RUNBOOK.md D.0 -- then measure, then set this.
# source_water_ec_us = 0.0

[meters]
# Front-panel Weston 301 centre-zero movements on an MCP4728 quad DAC.
# Each meter sits between two DAC channels with a fixed resistor per leg;
# both channels rest at midpoint_code, which is a centred needle.
# Series resistors limit the current, not this file — see docs/BOM.md.
enabled = false
i2c_address = 0x60
update_hz = 30                  # needle command rate
time_constant_seconds = 2.0     # easing; higher is more languid
sample_interval_seconds = 10.0  # how often to re-read the sensors
fault_timeout_seconds = 900.0   # stale this long -> ease to centre, flag fault

[meters.ph]
# 30-0-30 uA movement. Centre is the target; span is the half-range.
# `centre` defaults to [reservoir].ph_target -- see [meters.ec] below.
sensor_id = "ezo_ph"
span = 1.0                      # so 5.0 = full left, 7.0 = full right
dac_positive = "A"
dac_negative = "B"
midpoint_code = 2048
span_counts = 2048
invert = false
# Five-point linearisation, (commanded, actual) ascending. Empty = pass-through.
# calibration = [[-1.0, -1.0], [-0.5, -0.5], [0.0, 0.0], [0.5, 0.5], [1.0, 1.0]]

[meters.ec]
# 100-0-100 uA movement. EZO-EC reports uS/cm; scale converts to mS/cm.
# `centre` defaults to [reservoir].ec_target_us * scale and is left unset here
# so the dial cannot disagree with the alert band. Set it only to put the
# needle deliberately off-target.
# Span stays 1.0 mS/cm on purpose: it puts the 800-1,200 working band at about
# +/-20% of half-scale, which is the rule the dial-face note states.
sensor_id = "ezo_ec"
span = 1.0
scale = 0.001
dac_positive = "C"
dac_negative = "D"
midpoint_code = 2048
span_counts = 2048
invert = false

[display]
enabled = false
address = 0x3C

[notifications]
cooldown_seconds = 300  # Per-sensor cooldown between repeated notifications
muted_sensors = []      # Sensor ids whose alerts are recorded but NOT delivered.
                        # Use while bench-testing: probes sitting in a mug will sit
                        # permanently "critical" against reservoir thresholds, and a
                        # channel that cries wolf is a channel you stop reading.
                        # Empty this when the real build goes live.

[notifications.webhook]
enabled = false
url = ""                    # Where to POST on alert
timeout_seconds = 10.0
format = "raw"              # "raw"  -> POST JSON {event_type, description, timestamp, sensor_id}
                            # "ntfy" -> POST a plain-text line to an ntfy topic URL
                            #           (https://ntfy.sh/<your-topic>), with the title and
                            #           urgency as headers, so it lands as a readable phone
                            #           push. The topic name is the only secret: pick a long
                            #           random one, and anyone who knows it can read alerts.
